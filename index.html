/* Add rotating background using pseudo-element */
.cumulative-total {
  position: relative;

.cumulative-total::before {
  content: "";
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: repeating-conic-gradient(from 45deg, #f5f5f5 0deg 10deg, #e0f7fa 10deg 20deg);
  animation: rotateBackground 20s linear infinite;
  z-index: 0;

/* Container for perimeter canvas stroke */
.canvas-button.perimeter-effect {
  position: relative;
  background: linear-gradient(to bottom right, #4CAF50, #2e7d32);
  color: white;
  padding: 8px 18px;
  font-size: 16px;
  font-weight: bold;

  overflow: hidden;
  box-shadow: 0 6px #1b5e20;
  z-index: 0;
}


/* Content always above perimeter effect */
.canvas-button.perimeter-effect > * {
  position: relative;
  z-index: 2;
}

/* SVG animated border */
.canvas-button.perimeter-effect::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: none;
  z-index: 1;
  pointer-events: none;
  border-radius: 12px;
  mask-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" rx="12" ry="12" fill="none" stroke="white" stroke-width="4" stroke-dasharray="40, 17, 40, 17, 40, 17, 40, 17, 40, 17, 40, 17, 40, 17" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" from="0" to="-100" dur="2s" repeatCount="indefinite" /></rect></svg>');

  background-color: white;

}

      return Number(number).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).replace(/\s/g, '.');

      const days = ["Dimanche", "Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi"];

    // Fonction fanampiny ho an'ny formatage real-time
    function formatInputLive(input) {
      const cursorPosition = input.selectionStart;
      let value = input.value.replace(/[^\d.,]/g, ''); // Esorina ny tsy isa sy decimal
      value = value.replace(',', '.'); // Hanova ny , ho .
      
      const parts = value.split('.');
      const integerPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
      value = parts.length > 1 ? `${integerPart}.${parts[1].slice(0, 2)}` : integerPart;

      input.value = value;

      // Mametraka ny cursor eo amin'ny faran'ny texte rehefa vita ny formatage
      const newPosition = value.length; // Mijanona eo amin'ny farany tanteraka
      input.setSelectionRange(newPosition, newPosition);
    }

function dateDiffInDays(date1, date2) {
  const d1 = new Date(date1);
  const d2 = new Date(date2);
  const diffTime = d2 - d1;
  return Math.floor(diffTime / (1000 * 60 * 60 * 24));
}

    function enregistrerLigne(row) {
  if (!checkPermission('add')) return;

  console.log("Enregistrement d'une ligne...");
  const dateInput = row.querySelector('input[type="date"]');
  const montantInput = row.querySelector('td:nth-child(4) input[type="text"]');
  const autreRevenueInput = row.querySelector('td:nth-child(5) input[type="text"]');
  const depenseContainer = row.querySelector('.depense-container');
  const depenseInput = depenseContainer.querySelector('input[type="text"].number-input');
  const libelleInput = depenseContainer.querySelector('input[type="text"]:not(.number-input)');
  const actionCell = row.querySelector('td:last-child');

  const montantValue = parseFloat(montantInput.value.replace(/\s/g, '').replace(',', '.'));
  const autreRevenueValue = parseFloat(autreRevenueInput.value.replace(/\s/g, '').replace(',', '.')) || 0;
  const depenseValue = parseFloat(depenseInput.value.replace(/\s/g, '').replace(',', '.')) || 0;

  if (!dateInput.value || !montantInput.value) {
    alert("Veuillez saisir une date et un montant.");
    return;
  }

  if (montantValue <= 0) {
    const confirmer = confirm("Tsy misy vola na 0 Ar. Tianao ve hametraka an'io daty io ho 'Tsy niasa'?");
    if (confirmer) {
      const moisSelect = document.getElementById("moisSelect").value;
      const anneeInput = document.getElementById("anneeInput").value;
      const key = STORAGE_KEY_PREFIX + anneeInput + "_" + moisSelect;
      const data = JSON.parse(localStorage.getItem(key) || "[]");

      const newEntry = {
        date: dateInput.value,
        montant: "0.00",
        autreRevenue: autreRevenueValue.toFixed(2),
        depense: "0.00",
        libelle: "Tsy niasa"
      };

      data.push(newEntry);
      localStorage.setItem(key, JSON.stringify(data));
      loadData();
    }
    return;
  }

  const moisSelect = document.getElementById("moisSelect").value;
  const anneeInput = document.getElementById("anneeInput").value;
  const key = STORAGE_KEY_PREFIX + anneeInput + "_" + moisSelect;
  const data = JSON.parse(localStorage.getItem(key) || "[]");

  if (data.some(entry => entry.date === dateInput.value)) {
    alert("Cette date existe déjà dans le journal.");
    return;
  }

  const dateMonth = new Date(dateInput.value).getMonth();
  if (dateMonth != moisSelect) {
    if (!confirm("Attention: Cette date n'appartient pas au mois sélectionné. Voulez-vous quand même l'ajouter?")) {
      return;
    }
  }

  const newEntry = {
    date: dateInput.value,
    montant: montantValue.toFixed(2),
    autreRevenue: autreRevenueValue.toFixed(2),
    depense: depenseValue.toFixed(2)
  };
  if (libelleInput.value) {
    newEntry.libelle = libelleInput.value;
  }

  data.push(newEntry);
  localStorage.setItem(key, JSON.stringify(data));

  dateInput.readOnly = true;
  const montantSpan = document.createElement("span");
  montantSpan.textContent = formatNumber(montantValue);

  const autreRevenueSpan = document.createElement("span");
  autreRevenueSpan.textContent = formatNumber(autreRevenueValue);
  autreRevenueInput.parentNode.replaceChild(autreRevenueSpan, autreRevenueInput);
  montantInput.parentNode.replaceChild(montantSpan, montantInput);

  const depenseSpan = document.createElement("span");
  depenseSpan.textContent = formatNumber(depenseValue || "0");
  depenseInput.parentNode.replaceChild(depenseSpan, depenseInput);

  if (libelleInput.value) {
    const libelleSpan = document.createElement("span");
    libelleSpan.textContent = " - " + libelleInput.value;
    depenseContainer.appendChild(libelleSpan);
    depenseContainer.removeChild(libelleInput);
  } else {
    depenseContainer.removeChild(libelleInput);
  }
  actionCell.innerHTML = "Enregistré";

  updateTotal();
  updateCumulativePercent10();
  updateTotalVola();
  updateTotalVola2();
}

    function updateTotal() {

      const totalAutre = data.reduce((sum, entry) => sum + parseFloat(entry.autreRevenue || 0), 0);
      const totalDepense = data.reduce((sum, entry) => sum + parseFloat(entry.depense || 0), 0);
      document.getElementById("totalCell").textContent = formatNumber(total);
      document.getElementById("totalAutreRevenue").textContent = formatNumber(totalAutre);
      document.getElementById("totalDepense").textContent = formatNumber(totalDepense);

      document.getElementById("percent30").textContent = formatNumber(total * 0.30);
      document.getElementById("percent30Second").textContent = formatNumber(total * 0.30);
      document.getElementById("percent15").textContent = formatNumber(total * 0.15);
      document.getElementById("percent15Second").textContent = formatNumber(total * 0.15);
      document.getElementById("percent10").textContent = formatNumber(total * 0.10);
    }

    function updateCumulativePercent10() {
      const moisSelect = parseInt(document.getElementById("moisSelect").value);
      const anneeInput = document.getElementById("anneeInput").value;
      let totalPercent10 = 0;

      for (let i = 0; i <= moisSelect; i++) {
        const key = STORAGE_KEY_PREFIX + anneeInput + "_" + i;
        const data = JSON.parse(localStorage.getItem(key) || "[]");
        const total = data.reduce((sum, entry) => sum + parseFloat(entry.montant || 0), 0);
      const totalAutre = data.reduce((sum, entry) => sum + parseFloat(entry.autreRevenue || 0), 0);
        totalPercent10 += total * 0.10;
      }

      document.getElementById("cumulativePercent10").textContent = formatNumber(totalPercent10);
    }

    function updateTotalVola() {
      const moisSelect = document.getElementById("moisSelect").value;
      const anneeInput = document.getElementById("anneeInput").value;
      const key = STORAGE_KEY_PREFIX + anneeInput + "_" + moisSelect;
      const data = JSON.parse(localStorage.getItem(key) || "[]");

      const totalMontant = data.reduce((sum, entry) => sum + parseFloat(entry.montant || 0), 0);
      const totalDepense = data.reduce((sum, entry) => sum + parseFloat(entry.depense || 0), 0);
      const totalVola = (totalMontant * 0.30) - totalDepense;

      document.getElementById("totalVola").textContent = formatNumber(totalVola);
    }

    function updateTotalVola2() {
      const moisSelect = parseInt(document.getElementById("moisSelect").value);
      const anneeInput = document.getElementById("anneeInput").value;
      let totalVola2 = 0;

      for (let i = 0; i <= moisSelect; i++) {
        const key = STORAGE_KEY_PREFIX + anneeInput + "_" + i;
        const data = JSON.parse(localStorage.getItem(key) || "[]");
        const totalMontant = data.reduce((sum, entry) => sum + parseFloat(entry.montant || 0), 0);
        const totalDepense = data.reduce((sum, entry) => sum + parseFloat(entry.depense || 0), 0);
        const totalVola = (totalMontant * 0.30) - totalDepense;
        totalVola2 += totalVola;
      }

      document.getElementById("totalVola2").textContent = formatNumber(totalVola2);
    }

    function enregistrerPDF() {
      if (!checkPermission('export')) return;

      console.log("Tentative d'enregistrement en PDF...");
      const { jsPDF } = window.jspdf;
      if (!jsPDF || !window.jspdf) {
        alert("Erreur: jsPDF n'est pas chargé. Vérifiez votre connexion Internet.");
        return;
      }

      try {
        const doc = new jsPDF();
        const moisSelect = document.getElementById("moisSelect").value;
        const anneeInput = document.getElementById("anneeInput").value;
        const moisNom = moisList[moisSelect];
        const key = STORAGE_KEY_PREFIX + anneeInput + "_" + moisSelect;
        const data = JSON.parse(localStorage.getItem(key) || "[]");

        doc.setFontSize(18);
        doc.text(`Journal U-G - ${moisNom} ${anneeInput}`, 14, 15);
        doc.setFontSize(12);

        const tableData = data.map(entry => [
          entry.date,
          getJourSemaine(entry.date),
          `${formatNumberPDF(entry.montant)} Ar`,
          `${formatNumberPDF(entry.depense || 0)} Ar${entry.libelle ? " - " + entry.libelle : ""}`
        ]);

        const total = data.reduce((sum, entry) => sum + parseFloat(entry.montant), 0);
        const totalDepense = data.reduce((sum, entry) => sum + parseFloat(entry.depense || 0), 0);
        tableData.push(["TOTAL", "", `${formatNumberPDF(total)} Ar`, `${formatNumberPDF(totalDepense)} Ar`]);

        doc.autoTable({
          startY: 25,
          head: [['Date', 'Jour', 'Revenue', 'Depense']],
          body: tableData,
          theme: 'grid',
          headStyles: { fillColor: [76, 175, 80] },
          styles: { cellPadding: 3, fontSize: 10 },
          columnStyles: {
            2: { halign: 'right' },
            3: { halign: 'right' }
          }
        });

        let yPos = doc.lastAutoTable.finalY + 10;
        doc.text("Repartition (Fizarana):", 14, yPos);
        yPos += 7;
        doc.text(` Jeux 30%: ${formatNumberPDF(total * 0.30)} Ar`, 14, yPos);
        yPos += 7;
        doc.text(` Poussy 30%: ${formatNumberPDF(total * 0.30)} Ar`, 14, yPos);
        yPos += 7;
        doc.text(`Samba et Santatra 15%: ${formatNumberPDF(total * 0.15)} Ar`, 14, yPos);
        yPos += 7;
        doc.text(`10%: ${formatNumberPDF(total * 0.10)} Ar`, 14, yPos);

        const totalPercent10 = parseFloat(document.getElementById("cumulativePercent10").textContent.replace(/\s/g, '')) || 0;
        yPos += 7;
        doc.text(`Total 10% : ${formatNumberPDF(totalPercent10)} Ar`, 14, yPos);

        const totalVola = parseFloat(document.getElementById("totalVola").textContent.replace(/\s/g, '')) || 0;
        yPos += 7;
        doc.text(`Vola Jeux Reste de cette mois: ${formatNumberPDF(totalVola)} Ar`, 14, yPos);

        const totalVola2 = parseFloat(document.getElementById("totalVola2").textContent.replace(/\s/g, '')) || 0;
        yPos += 7;
        doc.text(`Total Vola Jeux Restant: ${formatNumberPDF(totalVola2)} Ar`, 14, yPos);

        doc.save(`Journal_Caisse_${moisNom}_${anneeInput}.pdf`);
        console.log("PDF généré avec succès.");
      } catch (e) {
        console.error("Erreur lors de la génération du PDF:", e);
        alert("Erreur lors de la génération du PDF: " + e.message);
      }
    }

    function imprimer() {
      if (!checkPermission('print')) return;
      console.log("Tentative d'impression...");
      window.print();
    }

    function restaurerCompte() {
      if (!checkPermission('restore')) return;
      
      console.log("Restauration des données...");
      const restoreCode = "1234"; // Kaody tsotra ho fanamarinana (azo ovaina)
      const userInput = prompt("Ampidiro ny kaody hanamarinana ny famerenana (restoration):");

      if (userInput === restoreCode) {
        if (confirm("Ho Restorena tokoa ve? Voafafa daholo izay Donnée rehetra amin'ity volana ity raha toa ka Eny.")) {
          const moisSelect = document.getElementById("moisSelect").value;
          const anneeInput = document.getElementById("anneeInput").value;

          showSuccessModal();
        }
      } else {

      }
    }
  </script>

<!-- Custom Modal -->
<div id="successModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:10000; justify-content:center; align-items:center;">
  <canvas id="fireworksCanvas" style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:0;"></canvas>
  <div style="background:white; padding:20px 30px; border-radius:10px; z-index:1; text-align:center; font-size:20px; color:#2e7d32; box-shadow:0 0 20px rgba(255,255,255,0.4);">
    <strong class="flash-text">Tanteraka ny sitraponao!</strong><br><br>
    <button onclick="closeSuccessModal()" style="margin-top:15px; padding:10px 20px; border:none; background:#4CAF50; color:white; font-weight:bold; border-radius:6px; font-size:16px;">OK</button>
  </div>
</div>
<script>
function showSuccessModal() {
  const modal = document.getElementById('successModal');
  modal.style.display = 'flex';
  document.getElementById('fireworksSound').play();

  const canvas = document.getElementById('fireworksCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const particles = [];
  for (let i = 0; i < 80; i++) {
    particles.push({
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: Math.random() * 3 + 2,
      color: 'hsl(' + Math.random() * 360 + ', 100%, 60%)',
      angle: Math.random() * 2 * Math.PI,
      speed: Math.random() * 5 + 2,
      alpha: 1
    });
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      ctx.globalAlpha = p.alpha;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, 2 * Math.PI);
      ctx.fillStyle = p.color;
      ctx.fill();
      p.x += Math.cos(p.angle) * p.speed;
      p.y += Math.sin(p.angle) * p.speed;
      p.alpha -= 0.01;
    });
    if (particles.some(p => p.alpha > 0)) {
      requestAnimationFrame(animate);
    }
  }
  animate();
  setTimeout(closeSuccessModal, 5000);
}

function closeSuccessModal() {
  const modal = document.getElementById('successModal');
  modal.style.display = 'none';
}
</script>
